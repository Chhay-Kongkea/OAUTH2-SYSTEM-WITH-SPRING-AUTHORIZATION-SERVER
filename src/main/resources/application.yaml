

server:
  port: 9000

spring:
  application:
    name: spring-authorization-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oauth2_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  oauth2:
    client-id: ${OAUTH2_CLIENT_ID:postman-client}
    redirect-uri: ${OAUTH2_REDIRECT_URI:https://oauth.pstmn.io/v1/callback}
